# Modified from: actions/typescript-action
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test_typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    outputs:
      dist_changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          java-package: 'jre'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Antlr4 Parser and Lexer
        run: npm run antlr4ng

      - name: Check Format and linting
        run: npm run ci

      - name: Test
        run: npm run test

      - name: Build dist/ Directory
        run: npm run bundle

      - name: Compare Directories
        id: diff
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          if [ "$(git diff --ignore-space-at-eol --text dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff --ignore-space-at-eol --text dist/
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # If `dist/` was different than expected, upload the expected version as artifact
      - if: ${{ !cancelled() && steps.diff.outcome == 'failure' }}
        name: Upload Artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test_action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    needs:
      - test_typescript
    permissions:
      checks: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # If `dist/` was different than expected, download the actual build
      - if: needs.test_typescript.outputs.dist_changed == 'true'
        name: Remove old dist
        run: rm -rf dist/

      - if: needs.test_typescript.outputs.dist_changed == 'true'
        name: Download built
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Test Local Action
        uses: ./
        with:
          patchName: Testing
          rootPath: .github/workflows/live

  dependabot-commit-build:
    name: Commit build to Dependabot PR
    runs-on: ubuntu-latest
    needs:
      - test_typescript
      - test_action
    permissions:
      contents: write
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      needs.test_typescript.outputs.dist_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove old dist
        run: rm -rf dist/

      - name: Download built
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "Update build"
          git push
